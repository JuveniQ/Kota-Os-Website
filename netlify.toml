# Astro generates real static routes. Missing APK paths must return 404,
# rather than silently serving index.html with a misleading 200 response.
[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"

# The app's error screen links here (kota-os_dev-env GlobalErrorBoundary).
[[redirects]]
from = "/support"
to = "/contact"
status = 301
